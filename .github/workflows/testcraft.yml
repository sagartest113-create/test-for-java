# TestCraft AI — self-correcting JUnit test generation
#
# Trigger: comment "/generate-tests" on a pull request.
# The engine generates tests for the PR's changed src/main files, then runs a
# compile → test → repair → coverage loop until the suite is green, and pushes
# the result back to the PR branch.
#
# Configure once (Settings → Secrets and variables → Actions):
#   Secret   TESTCRAFT_API_KEY    your LLM key (Anthropic / OpenAI / Groq / custom)
#   Variable TESTCRAFT_PROVIDER   anthropic | openai | groq | custom   (default: anthropic)
#   Variable TESTCRAFT_MODEL      (optional) model id override
#   Variable TESTCRAFT_BASE_URL   (only for provider=custom) OpenAI-compatible endpoint
#
# Swapping AI = changing the secret/variable. Nothing in the engine changes.

name: 🤖 TestCraft AI — Generate Tests

on:
  issue_comment:
    types: [created]

jobs:
  generate-tests:
    if: github.event.issue.pull_request != null && contains(github.event.comment.body, '/generate-tests')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Resolve PR refs
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo,
              pull_number: context.payload.issue.number
            });
            core.setOutput('head_ref', pr.data.head.ref);
            core.setOutput('base_ref', pr.data.base.ref);

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate + self-correct tests
        id: gen
        env:
          # Accept config from either Variables or Secrets, so it works wherever you set it.
          TESTCRAFT_PROVIDER: ${{ vars.TESTCRAFT_PROVIDER || secrets.TESTCRAFT_PROVIDER || 'anthropic' }}
          TESTCRAFT_MODEL: ${{ vars.TESTCRAFT_MODEL || secrets.TESTCRAFT_MODEL }}
          TESTCRAFT_BASE_URL: ${{ vars.TESTCRAFT_BASE_URL || secrets.TESTCRAFT_BASE_URL }}
          TESTCRAFT_API_KEY: ${{ secrets.TESTCRAFT_API_KEY }}
          # For weaker models: set Variable TESTCRAFT_SEQUENTIAL=1 (one file at a time)
          # and bump TESTCRAFT_MAX_FIX_ATTEMPTS (e.g. 6). Both optional.
          TESTCRAFT_SEQUENTIAL: ${{ vars.TESTCRAFT_SEQUENTIAL || secrets.TESTCRAFT_SEQUENTIAL }}
          TESTCRAFT_MAX_FIX_ATTEMPTS: ${{ vars.TESTCRAFT_MAX_FIX_ATTEMPTS || secrets.TESTCRAFT_MAX_FIX_ATTEMPTS }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
        run: |
          if [ -z "$TESTCRAFT_API_KEY" ]; then
            echo "TESTCRAFT_API_KEY secret is not set." >&2
            echo "status=missing-key" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node testcraft/src/cli.js \
            --changed "origin/$BASE_REF" \
            --java-home "$JAVA_HOME" \
            --coverage-target 95 \
            --quarantine-on-fail \
          && echo "status=ok" >> "$GITHUB_OUTPUT" \
          || echo "status=failed" >> "$GITHUB_OUTPUT"

      - name: Commit generated tests
        if: steps.gen.outputs.status == 'ok'
        run: |
          git config user.name  "TestCraft AI Bot"
          git config user.email "testcraft-ai[bot]@users.noreply.github.com"
          git add -A "src/test/java"
          if git diff --cached --quiet; then
            echo "No test changes to commit."
          else
            git commit -m "🤖 TestCraft AI: add self-corrected JUnit tests"
            git push origin "HEAD:${{ steps.pr.outputs.head_ref }}"
          fi

      - name: Comment result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const status = ${{ toJSON(steps.gen.outputs.status) }} || 'unknown';
            let body = '🤖 **TestCraft AI** — ';

            if (status === 'missing-key') {
              body += '⚠️ `TESTCRAFT_API_KEY` is not set. Add it under Settings → Secrets and variables → Actions.';
            } else if (!fs.existsSync('testcraft-result.json')) {
              body += '❌ Run did not complete — check the Actions log.';
            } else {
              const r = JSON.parse(fs.readFileSync('testcraft-result.json', 'utf8'));
              const cov = r.coverage ? `${r.coverage.line}% line / ${r.coverage.branch}% branch` : 'n/a';
              const icon = r.status === 'green' ? '✅' : r.status === 'partial' ? '⚠️' : '❌';
              body += `${icon} Added **${r.testCasesAdded}** test case(s) across **${r.testFilesGenerated}** file(s) ` +
                      `(${r.createdFiles} new, ${r.extendedFiles} extended).\n\n`;
              body += `| Metric | Value |\n|---|---|\n`;
              body += `| Suite status | ${r.status} |\n`;
              body += `| Test cases added | ${r.testCasesAdded} |\n`;
              body += `| Test files (new / extended) | ${r.testFilesGenerated} (${r.createdFiles} / ${r.extendedFiles}) |\n`;
              body += `| Coverage | ${cov} |\n`;
              if (r.quarantined && r.quarantined.length) {
                body += `\n⚠️ Could not green (quarantined to \`.skip\`):\n` +
                        r.quarantined.map((f) => `- \`${f}\``).join('\n') + '\n';
              }
              body += `\n<details><summary>Per-file breakdown</summary>\n\n| Test file | Cases | Type | Mode |\n|---|---|---|---|\n` +
                      r.files.map((f) => `| \`${f.test.replace('src/test/java/', '')}\` | ${f.tests} | ${f.type} | ${f.mode === 'extend' ? 'extended' : 'new'} |`).join('\n') +
                      `\n\n</details>`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.payload.issue.number, body
            });
